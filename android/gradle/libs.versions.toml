[versions]
agp                 = "8.10.1"
kotlin              = "2.1.21"
compose-bom         = "2026.09.00"
core-ktx            = "1.16.0"
lifecycle           = "2.9.1"
activity-compose    = "1.10.1"
splashscreen        = "1.0.1"
webkit              = "1.13.0"

[libraries]
androidx-core-ktx               = { group = "androidx.core",         name = "core-ktx",                     version.ref = "core-ktx" }
androidx-lifecycle-runtime      = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",        version.ref = "lifecycle" }
androidx-lifecycle-viewmodel    = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
androidx-activity-compose       = { group = "androidx.activity",      name = "activity-compose",             version.ref = "activity-compose" }
compose-bom                     = { group = "androidx.compose",       name = "compose-bom",                  version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui",    name = "ui" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
compose-ui-tooling              = { group = "androidx.compose.ui",    name = "ui-tooling" }
compose-material3               = { group = "androidx.compose.material3", name = "material3" }
compose-animation               = { group = "androidx.compose.animation", name = "animation" }
splashscreen                    = { group = "androidx.core",          name = "core-splashscreen",            version.ref = "splashscreen" }
webkit                          = { group = "androidx.webkit",        name = "webkit",                       version.ref = "webkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler    = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
