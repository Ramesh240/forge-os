<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scene 5 - Outro & Launch CTA (Widescreen 16:9)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #0c1730 0%, #050a17 65%, #020409 100%);
      font-family: 'Outfit', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 120px;
      position: relative;
    }

    /* Ambient glows */
    .glow-cyan {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
    }
    .glow-indigo {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translate(-50%, 50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
    }

    .logo-container {
      position: relative;
      margin-bottom: 24px;
    }
    .hero-logo {
      width: 140px;
      height: 140px;
      border-radius: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.5), 0 20px 40px rgba(0, 0, 0, 0.8);
    }
    .pulse-ring {
      position: absolute;
      inset: -18px;
      border-radius: 48px;
      border: 2px dashed rgba(56, 189, 248, 0.5);
      pointer-events: none;
    }

    .brand-title {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.3);
    }
    .brand-tagline {
      font-size: 28px;
      color: #94a3b8;
      font-weight: 600;
      text-align: center;
      margin-bottom: 40px;
    }

    /* 4 Pillars */
    .pillar-row {
      display: flex;
      gap: 20px;
      margin-bottom: 44px;
    }
    .p-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 14px 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(16px);
    }
    .p-pill span {
      color: #38bdf8;
    }

    /* Badges & CTA row */
    .action-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 30px;
    }
    .store-badge {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      backdrop-filter: blur(20px);
    }
    .sb-icon {
      font-size: 28px;
    }
    .sb-label {
      font-size: 13px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
    }
    .sb-val {
      font-size: 20px;
      font-weight: 800;
    }

    .cta-btn {
      padding: 22px 48px;
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 50%, #38bdf8 100%);
      border-radius: 999px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #030712;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.6), 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .bottom-domain {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #64748b;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="glow-cyan"></div>
  <div class="glow-indigo"></div>

  <div class="logo-container" id="logoBox">
    <img src="assets/logo.png" class="hero-logo" alt="ForgeOS">
    <div class="pulse-ring" id="pulseRing"></div>
  </div>

  <div class="brand-title">FORGEOS</div>
  <div class="brand-tagline">Upgrade Your Human Operating System.</div>

  <div class="pillar-row">
    <div class="p-pill"><span>⚡</span> Identity Vectors</div>
    <div class="p-pill"><span>⏱️</span> 2-Minute Gateway</div>
    <div class="p-pill"><span>📊</span> Continuity Engine</div>
    <div class="p-pill"><span>🛡️</span> Rebound Priority</div>
  </div>

  <div class="action-row">
    <div class="store-badge">
      <div class="sb-icon">🤖</div>
      <div>
        <div class="sb-label">DOWNLOAD ON</div>
        <div class="sb-val">Google Play</div>
      </div>
    </div>

    <div class="store-badge">
      <div class="sb-icon">⚡</div>
      <div>
        <div class="sb-label">ACCESS ON</div>
        <div class="sb-val">Web App</div>
      </div>
    </div>

    <div class="cta-btn">
      <span>GET STARTED TODAY • FORGEOS.APP</span>
      <span>➔</span>
    </div>
  </div>

  <div class="bottom-domain">forgeos.app • com.forgeos.mastery • open source & private</div>

  <script type="module">
    function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }
    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

    const logoBox = document.getElementById('logoBox');
    const pulseRing = document.getElementById('pulseRing');

    window.film = {
      duration: 4.0,
      ready: document.fonts.ready,
      frame(t) {
        // Immediate visual presence on cut
        const inProg = easeOutCubic(clamp(t / 0.4, 0, 1));
        logoBox.style.transform = `scale(${1.06 - 0.06 * inProg})`;

        const pulse = 1 + 0.05 * Math.sin(t * 4);
        pulseRing.style.transform = `scale(${pulse}) rotate(${t * 30}deg)`;
      }
    };
  </script>
</body>
</html>
